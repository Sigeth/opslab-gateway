name: ci

# Pipelines live in github.com/Sigeth/opslab-ci (Dagger) and run the targets
# of this repository's Makefile. Run them locally with:
#   dagger -m github.com/Sigeth/opslab-ci@v0.1.0 call rust --source=. check --targets=lint,test,deny,build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.11"
          module: github.com/Sigeth/opslab-ci@v0.1.0
          verb: call
          args: rust --source=. check --targets=lint,test,deny,build

  # Builds and tests against the newest contract tag, to catch breakage
  # before the pinned version is bumped.
  contract-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.11"
          module: github.com/Sigeth/opslab-ci@v0.1.0
          verb: call
          args: rust --source=. check --targets=contract-latest

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.11"
          module: github.com/Sigeth/opslab-ci@v0.1.0
          verb: call
          args: image --source=.
