[package]
name = "opslab-gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
futures = "0.3"
k8s-openapi = { version = "0.29", default-features = false, features = ["std", "v1_34"] }
kube = { version = "5", default-features = false, features = ["client", "ws", "rustls-tls", "ring"] }
opslab-auth = { git = "https://github.com/Sigeth/opslab-core-rs", tag = "v0.2.0", version = "0.1" }
opslab-types = { git = "https://github.com/Sigeth/opslab-core-rs", tag = "v0.2.0", version = "0.1" }
russh = { version = "0.65", default-features = false, features = ["ring"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
# Smaller images: no symbols in release binaries.
strip = true
